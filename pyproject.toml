[project]
name = "agent-approval-guard"
version = "0.1.0"
description = "Code-level guards that stop an AI agent from publishing, deleting or paying without a human's approval."
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
